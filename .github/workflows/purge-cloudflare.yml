name: Purge Cloudflare Cache

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy to complete (90s)
        run: sleep 90

      - name: Purge Cloudflare Edge Cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ] || [ -z "$API_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN secret not configured in GitHub repository secrets. Skipping purge."
            exit 0
          fi
          
          echo "Purging Cloudflare Cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -o '"success":[^,]*'